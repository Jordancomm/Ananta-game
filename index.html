<!DOCTYPE html>
<head>
  <title>ANANTA</title>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.0.0/css/all.css">

  <style>
    html {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      position: relative;
      background: #8A9A5BB5;
      min-height: 100%;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }


    header {
      width: calc(100% - 300px);
      margin: 0 auto;
      height: 150px;
      border-radius: 30px;
      margin-top: 25px;
      background: linear-gradient(#ff5e3e,wheat);
      box-shadow: 0 0 0 1px #ff5e3e, 0 0 0 5px #f5deb38f;
    }
    nav {
      height: 20px;
      width: 100%;
      box-sizing: border-box;
      padding: 0 25px;
    }
    nav li {
      font-weight: bold;
      display: inline-block;
      color: white;
      margin: 0 5px;
    }
    #header-logo {
      width: 100%;
      height: calc(100% - 20px);
      background: linear-gradient(wheat,white);
      border-radius: 30px;
    }
    #header-logo span {
      display: block;
      text-align: center;
      line-height: 130px;
      font-size: 36px;
      font-weight: bold;
      color: white;
      text-shadow: -2px 1px 0 wheat, -3px 3px 0 #ff6242;
    }

    
    main {
      font-size: 0;
      width: calc(100% - 300px);
      margin: 0 auto;
      margin-top: 20px;
      padding-bottom: 100px;

      width: calc(100% - 30px);
      display: flex;
      justify-content: center;
      max-width: 1600px;
    }
    aside {
/*      width: 275px;*/
      display: inline-block;
      vertical-align: top;
      font-size: 14px;

      flex: 1 1 auto;
      max-width: 275px;
/*      min-width: 250px;*/
      flex: 1 1 0;
    }
    article {
/*      width: calc(100% - 600px);*/
      display: inline-block;
      vertical-align: top;
      font-size: 14px;
      margin-left: 25px;
      margin-right: 25px;

      flex: 3 1 auto;
    }
    .widgets, section {
      width: 100%;
      background: #fe6b4a;
      border-radius: 30px;
      box-shadow: 0 0 0 1px #fe6b4a, 0 0 0 5px #d4cca0;
      margin-bottom: 20px;
    }
    .widgets, .events {
      min-width: 250px;
    }
    .widgets-body, .section-body {
      min-height: 250px;
      background: linear-gradient(wheat,white);
      border-radius: 30px;
    }
    .widgets-title, .section-title {
      color: white;
      font-weight: bold;
      box-sizing: border-box;
      padding-left: 25px;
      height: 30px;
      line-height: 30px;
    }
    .widgets-body {
      box-sizing: border-box;
      padding: 10px 0;
    }
    .section-body {
      position: relative;

      box-sizing: border-box;
      padding: 40px 10px;
      overflow: hidden;
    }
    #widgets-labels li {
      width: calc(100% - 30px);
      height: 50px;
      background: white;
      border-radius: 16px;
      margin: 0 auto;
      margin-bottom: 5px;
      line-height: 50px;
      box-sizing: border-box;
      padding-left: 15px;
    }

    
    .section-info div {
      display: inline-block;
      vertical-align: top;
    }
    .section-date, .section-autor {
      background: white;
      border-radius: 10px;
      height: 30px;
      line-height: 30px;
      padding: 0 10px;
    }
    .section-info .seperator {
      width: 1px;
      height: 20px;
      background: black;
      margin: 0 5px;
      margin-top: 5px;
    }
    .section-info {
      box-sizing: border-box;
/*      padding: 0 25px;*/
      position: absolute;
      top: 5px;
      left: 25px;
      right: 25px;
    }

    .section-footer {
  position: absolute;
  bottom: 0;
  width: calc(100% - 20px);
  height: 36px;
  margin: 0 auto;
  left: 0;
  right: 0;
  border-radius: 30px 30px 0 0;
  font-size: 0;
  box-shadow: 0 -1px 0 0 #fe6b4a;
}
.section-footer > div {
  display: inline-block;
  vertical-align: top;
  font-size: 14px;
}
.section-footer-r {
  width: 150px;
}
.section-footer-l {
  width: calc(100% - 150px);
}
.section-readme {
  text-align: center;
}
.section-readme span {
  background: #fe6b4a;
  color: #fff;
  font-weight: bold;
  height: 30px;
  display: inline-block;
  line-height: 30px;
  padding: 0 15px;
  margin-top: 3px;
}

    .section-labels {
      background: #fe6b4a;
      color: #fff;
      font-weight: bold;
      height: 30px;
      display: inline-block;
      line-height: 30px;
      padding: 0 15px;
      margin-top: 3px;
      margin-left: 30px;
/*
      background: linear-gradient(wheat,white);
      border-radius: 10px;
      box-shadow: inset 0 -2px 0 0 #fe6b4a, inset 0 -3px 0 0 white;
      color: #fe6b4a;
      box-shadow: inset 0 -2px 0 0 #fe6b4a, inset 0 -3px 0 0 white, inset 0 0 0 1px #fe6b4a;
*/
    }

#popular-tags {
  background: wheat;
  border-radius: 10px;
  padding: 5px 10px;
  margin-bottom: 15px;

  padding: 5px 50px;
  position: relative;
  box-sizing: border-box;
}    
#popular-tags li {
  display: inline-block;
  vertical-align: top;
  color: white;
  font-weight: bold;
  background: #fe6b4a;
  border-radius: 10px;
  padding: 5px 15px;
  margin-right: 5px;
}

#popular-tags::before {
  content: '\f100';
  position: absolute;
  left: 0;
  top: 0;
  font: var(--fa-font-solid);
  width: 40px;
  bottom: 0;
  background: #fe6b4a;
  border-radius: 10px 0 0 10px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
    #popular-tags::after {
  content: '\f101';
  position: absolute;
  right: 0;
  top: 0;
  font: var(--fa-font-solid);
  width: 40px;
  bottom: 0;
  background: #fe6b4a;
  border-radius: 0 10px 10px 0;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}


    .events {
      width: 100%;
      border-radius: 30px;
      background: white;
      box-shadow: 0 0 0 5px #fe6b4a;
      box-shadow: 0 0 0 1px white, 0 0 0 5px #fe6b4a;
    }
    .events-title {
      height: 30px;
      line-height: 30px;
      font-weight: bold;
      box-sizing: border-box;
      padding-left: 25px;
    }
    .events-body {
      min-height: 500px;
      background: wheat;
      border-radius: 30px;
      box-sizing: border-box;
      padding: 10px 0;
    }
    .events-body li {
      width: calc(100% - 30px);
      height: 50px;
      background: white;
      border-radius: 16px;
      margin: 0 auto;
      margin-bottom: 5px;
      line-height: 50px;
      box-sizing: border-box;
      padding-left: 15px;
    }
    
    footer {
      width: calc(100% - 300px);
      height: 100px;
      background: linear-gradient(wheat, white);
      margin: 0 auto;
      margin-top: 20px;
      box-shadow: 0 0 0 1px #fe6b4a, 0 0 0 5px #d4cca0;
      border-radius: 30px 30px 0 0;
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
    }
  </style>
</head>

</html>
