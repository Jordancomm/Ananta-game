<!DOCTYPE html>
<head>
  <title>ANANTA</title>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v7.0.0/css/all.css">

  <style>
    html {
      height: 100%;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      position: relative;
      background: #8A9A5BB5;
      min-height: 100%;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }


    header {
      width: calc(100% - 300px);
      margin: 0 auto;
      height: 150px;
      border-radius: 30px;
      margin-top: 25px;
      background: linear-gradient(#ff5e3e,wheat);
      box-shadow: 0 0 0 1px #ff5e3e, 0 0 0 5px #f5deb38f;
    }
    nav {
      height: 20px;
      width: 100%;
      box-sizing: border-box;
      padding: 0 25px;
    }
    nav li {
      font-weight: bold;
      display: inline-block;
      color: white;
      margin: 0 5px;
    }
    #header-logo {
      width: 100%;
      height: calc(100% - 20px);
      background: linear-gradient(wheat,white);
      border-radius: 30px;
    }
    #header-logo span {
      display: block;
      text-align: center;
      line-height: 130px;
      font-size: 36px;
      font-weight: bold;
      color: white;
      text-shadow: -2px 1px 0 wheat, -3px 3px 0 #ff6242;
    }

    
    main {
      font-size: 0;
      width: calc(100% - 300px);
      margin: 0 auto;
      margin-top: 20px;
    }
    aside {
      width: 275px;
      display: inline-block;
      vertical-align: top;
      font-size: 14px;
    }
    article {
      width: calc(100% - 300px);
      display: inline-block;
      vertical-align: top;
      font-size: 14px;
      margin-left: 25px;
    }
    .widgets, section {
      width: 100%;
      background: #fe6b4a;
      border-radius: 30px;
      box-shadow: 0 0 0 1px #fe6b4a, 0 0 0 5px #d4cca0;
    }
    .widgets-body, .section-body {
      min-height: 250px;
      background: linear-gradient(wheat,white);
      border-radius: 30px;
    }
    .widgets-title, .section-title {
      color: white;
      font-weight: bold;
      box-sizing: border-box;
      padding-left: 25px;
      height: 30px;
      line-height: 30px;
    }
    .widgets-body {
      box-sizing: border-box;
      padding: 10px 0;
    }
    #widgets-labels li {
      width: calc(100% - 30px);
      height: 50px;
      background: white;
      border-radius: 16px;
      margin: 0 auto;
      margin-bottom: 5px;
      line-height: 50px;
      box-sizing: border-box;
      padding-left: 15px;
    }
    footer {
      width: calc(100% - 300px);
      height: 100px;
      background: linear-gradient(wheat, white);
      margin: 0 auto;
      margin-top: 20px;
      box-shadow: 0 0 0 1px #fe6b4a, 0 0 0 5px #d4cca0;
      border-radius: 30px 30px 0 0;
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li>Text</li>
        <li>Text</li>
        <li>Text</li>
      </ul>
    </nav>
    <div id='header-logo'>
      <span>ANANTA</span>
    </div>
  </header>
  <main>
    <aside>
      <div class='widgets' id='widgets-labels'>
        <div class='widgets-title'>Title</div>
        <div class='widgets-body'>
          <ul>
            <li>Text</li>
            <li>Text</li>
            <li>Text</li>
          </ul>
        </div>
      </div>
    </aside>
    <article>
      <section>      
        <div class='section-title'>Title</div>
        <div class='section-body'>

          <div class='section-info'>
            <div class='section-date'><i class="fa-regular fa-calendar-days"></i> 18.11.26</div>
            <div class='seperator'></div>
            <div class='section-autor'><i class="fa-regular fa-user"></i> ANANTA</div>
          </div>
        </div>
      </section>
    </article>
  </main>
  <footer>
    
  </footer>
</body>
</html>
